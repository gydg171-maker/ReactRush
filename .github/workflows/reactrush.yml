name: ReactRush

on:
  workflow_dispatch:

  schedule:
    # 11:20 PM Egypt (UTC+3)
    - cron: "50 20 * * *"

    # 2:00 AM Egypt (UTC+3)
    - cron: "0 23 * * *"

    # 5:00 AM Egypt (UTC+3)
    - cron: "0 2 * * *"

permissions:
  contents: read

concurrency:
  group: reactrush
  cancel-in-progress: false

jobs:
  reactrush:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ========================================================
      # CHECKOUT
      # ========================================================
      - name: Checkout repository
        uses: actions/checkout@v5

      # ========================================================
      # PYTHON
      # ========================================================
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # ========================================================
      # PYTHON DEPENDENCIES
      # ========================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ========================================================
      # FFMPEG
      # ========================================================
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
          ffprobe -version

      # ========================================================
      # CREDENTIALS DIRECTORY
      # ========================================================
      - name: Create credentials directory
        run: |
          mkdir -p "$HOME/.reactrush"

      # ========================================================
      # GOOGLE DRIVE TOKEN
      # ========================================================
      - name: Create Google Drive token
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
        run: |
          printf '%s' "$DRIVE_TOKEN_JSON" > "$HOME/.reactrush/drive_token.json"
          test -s "$HOME/.reactrush/drive_token.json"

      # ========================================================
      # YOUTUBE TOKEN
      # ========================================================
      - name: Create YouTube token
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          printf '%s' "$YOUTUBE_TOKEN_JSON" > "$HOME/.reactrush/youtube_token.json"
          test -s "$HOME/.reactrush/youtube_token.json"

      # ========================================================
      # RUN REACTRUSH
      # ========================================================
      - name: Run ReactRush
        env:
          # IMPORTANT:
          # reactrush.py reads DRIVE_TOKEN_FILE / YOUTUBE_TOKEN_FILE.
          DRIVE_TOKEN_FILE: /home/runner/.reactrush/drive_token.json
          YOUTUBE_TOKEN_FILE: /home/runner/.reactrush/youtube_token.json

          # Keep the actual runtime files in the exact same place we create them.
          HOME: /home/runner
        run: |
          echo "=============================================="
          echo "REACTRUSH"
          echo "=============================================="

          echo "Drive token:"
          ls -lh "$HOME/.reactrush/drive_token.json"

          echo "YouTube token:"
          ls -lh "$HOME/.reactrush/youtube_token.json"

          python reactrush.py
