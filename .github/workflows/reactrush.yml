name: ReactRush

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */8 * * *"

concurrency:
  group: reactrush-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      DRIVE_TOKEN_FILE: ${{ github.workspace }}/.runtime/drive_token.json
      YOUTUBE_TOKEN_FILE: ${{ github.workspace }}/.runtime/youtube_token.json

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Prepare OAuth tokens
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          mkdir -p .runtime
          printf '%s' "$DRIVE_TOKEN_JSON" > "$DRIVE_TOKEN_FILE"
          printf '%s' "$YOUTUBE_TOKEN_JSON" > "$YOUTUBE_TOKEN_FILE"

      - name: Run ReactRush
        env:
          PYTHONUNBUFFERED: "1"
        run: python reactrush.py

      - name: Cleanup secrets
        if: always()
        run: rm -rf .runtime
