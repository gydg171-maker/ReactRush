name: ReactRush

on:
  workflow_dispatch:

  schedule:
    # 4:00 PM ET تقريبًا
    - cron: "0 20 * * *"

    # 7:00 PM ET تقريبًا
    - cron: "0 23 * * *"

    # 10:00 PM ET تقريبًا
    - cron: "0 2 * * *"

permissions:
  contents: read

concurrency:
  group: reactrush
  cancel-in-progress: false

jobs:
  reactrush:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install FFmpeg
        uses: FedericoCarbonara/setup-ffmpeg@v3

      - name: Create credentials directory
        run: |
          mkdir -p "$HOME/.reactrush"

      - name: Create Google Drive token
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
        run: |
          printf '%s' "$DRIVE_TOKEN_JSON" > "$HOME/.reactrush/drive_token.json"

      - name: Create YouTube token
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          printf '%s' "$YOUTUBE_TOKEN_JSON" > "$HOME/.reactrush/youtube_token.json"

      - name: Run ReactRush
        env:
          DRIVE_TOKEN_PATH: ${{ github.workspace }}/drive_token.json
          YOUTUBE_TOKEN_PATH: ${{ github.workspace }}/youtube_token.json
        run: |
          python reactrush.py
